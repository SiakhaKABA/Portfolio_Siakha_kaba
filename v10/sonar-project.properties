# Informations obligatoires du projet
sonar.projectKey=Portfolio-Siakha-KABA
sonar.projectName=Portfolio Siakha KABA
sonar.projectVersion=1.0

# Informations GitHub (optionnel)
# sonar.links.homepage=https://github.com/SiakhaKABA/Portfolio_Siakha_kaba
# sonar.links.scm=https://github.com/SiakhaKABA/Portfolio_Siakha_kaba.git
# sonar.branch.name=Siakha-KABA

# Chemin des sources
sonar.sources=backend,frontend/src

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.js,**/*.spec.js,**/coverage/**,**/.env

# Encodage des fichiers sources
sonar.sourceEncoding=UTF-8

# Langage et chemins spécifiques
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Configuration Backend (Node.js/Express)
sonar.sources.backend=backend
sonar.exclusions.backend=backend/node_modules/**

# Configuration Frontend (React/Vite)
sonar.sources.frontend=frontend/src

# URL du serveur SonarQube (port 9100 car 9000 réservé par Windows)
sonar.host.url=http://localhost:9100

# Token d'authentification (configuré dans Jenkins credentials)
# Pour analyse locale: décommentez et ajoutez votre token
# sonar.token=sqa_da093ede49e54806eed3150a287f002885c3a662
