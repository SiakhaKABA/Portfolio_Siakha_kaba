global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/alerts-cicd.yml

scrape_configs:
  # ── Application & Infrastructure ─────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'portfolio-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['portfolio-backend:3001']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # ── Jenkins ──────────────────────────────────────────────
  - job_name: 'jenkins'
    metrics_path: /prometheus/
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          instance: 'jenkins-local'

  # ── SonarQube ────────────────────────────────────────────
  - job_name: 'sonarqube'
    metrics_path: /api/monitoring/metrics
    static_configs:
      - targets: ['host.docker.internal:9000']
        labels:
          instance: 'sonarqube-local'

  # ── GitHub Exporter ──────────────────────────────────────
  - job_name: 'github'
    static_configs:
      - targets: ['github-exporter:9171']

  # ── Kubernetes ───────────────────────────────────────────
  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics:8080']

  - job_name: 'kubernetes-apiservers'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    static_configs:
      - targets: ['host.docker.internal:6443']
        labels:
          instance: 'k8s-local'

  # ── Blackbox Exporter (health checks) ───────────────────
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:8080/login
          - http://host.docker.internal:9000
          - https://github.com/Siakha-KABA
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
