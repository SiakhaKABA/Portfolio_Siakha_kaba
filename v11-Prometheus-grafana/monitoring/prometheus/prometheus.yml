global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/alerts-cicd.yml

scrape_configs:
  # ── Application & Infrastructure ─────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'portfolio-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['metrics-simulator:9999']
        labels:
          instance: 'backend-local'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'portfolio_backend_.*'
        action: keep

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # ── CI/CD Simulator ──────────────────────────────────────
  - job_name: 'jenkins'
    metrics_path: /metrics
    static_configs:
      - targets: ['metrics-simulator:9999']
        labels:
          instance: 'jenkins-local'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'jenkins_.*'
        action: keep

  - job_name: 'sonarqube'
    metrics_path: /metrics
    static_configs:
      - targets: ['metrics-simulator:9999']
        labels:
          instance: 'sonarqube-local'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'sonarqube_.*'
        action: keep

  - job_name: 'github'
    metrics_path: /metrics
    static_configs:
      - targets: ['metrics-simulator:9999']
        labels:
          instance: 'github'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'github_.*'
        action: keep

  - job_name: 'kube-state-metrics'
    metrics_path: /metrics
    static_configs:
      - targets: ['metrics-simulator:9999']
        labels:
          instance: 'kubernetes'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'kube_.*|container_.*|docker_.*'
        action: keep

  - job_name: 'terraform'
    metrics_path: /metrics
    static_configs:
      - targets: ['metrics-simulator:9999']
        labels:
          instance: 'terraform'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'terraform_.*'
        action: keep

  - job_name: 'blackbox-http'
    metrics_path: /metrics
    honor_labels: true
    static_configs:
      - targets: ['metrics-simulator:9999']
        labels:
          instance: 'blackbox'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'probe_.*'
        action: keep
