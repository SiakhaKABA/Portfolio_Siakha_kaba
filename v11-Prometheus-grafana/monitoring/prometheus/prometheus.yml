global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/alerts-cicd.yml

scrape_configs:
  # ── Application & Infrastructure ─────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'portfolio-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['portfolio-backend:3001']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # ── CI/CD Simulator ──────────────────────────────────────
  - job_name: 'jenkins'
    metrics_path: /metrics
    static_configs:
      - targets: ['metrics-simulator:9999']
        labels:
          instance: 'jenkins-local'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(up|jenkins_.*)'
        action: keep

  - job_name: 'sonarqube'
    metrics_path: /metrics
    static_configs:
      - targets: ['metrics-simulator:9999']
        labels:
          instance: 'sonarqube-local'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(up|sonarqube_.*)'
        action: keep

  - job_name: 'github'
    metrics_path: /metrics
    static_configs:
      - targets: ['metrics-simulator:9999']
        labels:
          instance: 'github'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(up|github_.*)'
        action: keep

  - job_name: 'kube-state-metrics'
    metrics_path: /metrics
    static_configs:
      - targets: ['metrics-simulator:9999']
        labels:
          instance: 'kubernetes'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(up|kube_.*)'
        action: keep

  - job_name: 'terraform'
    metrics_path: /metrics
    static_configs:
      - targets: ['metrics-simulator:9999']
        labels:
          instance: 'terraform'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(up|terraform_.*)'
        action: keep

  - job_name: 'blackbox-http'
    metrics_path: /metrics
    static_configs:
      - targets: ['metrics-simulator:9999']
        labels:
          instance: 'blackbox'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(up|probe_.*|pipeline_.*)'
        action: keep

  # ── Real services (backup, via host network) ─────────────
  - job_name: 'jenkins-real'
    metrics_path: /prometheus/
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          instance: 'jenkins-host'

  - job_name: 'sonarqube-real'
    metrics_path: /api/monitoring/metrics
    static_configs:
      - targets: ['host.docker.internal:9000']
        labels:
          instance: 'sonarqube-host'

  - job_name: 'kubernetes-apiservers'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    static_configs:
      - targets: ['host.docker.internal:6443']
        labels:
          instance: 'k8s-local'
