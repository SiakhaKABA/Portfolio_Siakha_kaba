server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Resolver DNS Kubernetes (CoreDNS) + Docker embedded DNS
    resolver kube-dns.kube-system.svc.cluster.local 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # SPA React : toutes les routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API → backend Express (port 3001)
    location /api/ {
        set $backend http://backend.default.svc.cluster.local:3001;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        client_max_body_size 10m;
    }
}
